<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F5F0">
<title>Blurty — aprenda inglês conversando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F0; --card:#FFFFFF; --ink:#26241F; --muted:#6F6A62; --line:#E7E2D8; --line2:#D9D3C7; --tint:#EFECE6;
    --ok:#2E7A4E; --ok-l:#E4F2E9; --no:#B0473A; --no-l:#F7E4E0;
    --accent:#4A4740; --accent-d:#2E2C27; --soft:#EEEBE5; --mbody:#BDB7AC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:#ECE8E0;color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
  #app{width:100%;max-width:560px;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 0 1px var(--line)}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
  h1,h2,h3,.logo,.disp{font-family:"Baloo 2",Nunito,sans-serif}
  .screen{animation:in .28s ease;padding-bottom:110px}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ----- mascote ----- */
  .msvg{width:100%;height:100%;overflow:visible}
  .msvg .whole{transform-origin:60px 110px}
  .mood-idle .whole,.mood-welcome .whole,.mood-encourage .whole{animation:bob 3s ease-in-out infinite}
  .mood-happy .whole{animation:hop .55s ease 2}
  .mood-sad .whole,.mood-oops .whole{animation:wobble .7s ease 1}
  .mood-thinking .whole{animation:tilt 3.2s ease-in-out infinite}
  .mood-surprised .whole{animation:pop .45s ease 1}
  .floaty.mood-idle .whole,.floaty.mood-welcome .whole{animation:float 3.4s ease-in-out infinite}
  .orb{animation:twinkle 2.2s ease-in-out infinite}
  .dots circle{animation:twinkle 1.4s ease-in-out infinite}
  .dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}
  .mood-excited .whole{animation:jump .5s ease 3}
  .mood-celebrate .whole{animation:party 1s ease 2}
  .mood-idle .eye,.mood-welcome .eye,.mood-encourage .eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
  .arm-wave{animation:wave .9s ease-in-out infinite}
  .spark{animation:twinkle 1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
  @keyframes float{50%{transform:translateY(-8px)}}
  @keyframes tilt{50%{transform:rotate(-4deg)}}
  @keyframes pop{40%{transform:scale(1.12)}}
  @keyframes hop{40%{transform:translateY(-14px) scale(1.03,.97)}}
  @keyframes wobble{20%{transform:rotate(-8deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
  @keyframes jump{50%{transform:translateY(-18px)}}
  @keyframes party{30%{transform:translateY(-16px) rotate(-8deg)}60%{transform:translateY(-16px) rotate(8deg)}}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  @keyframes wave{50%{transform:rotate(-22deg)}}
  @keyframes twinkle{50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.msvg *{animation:none!important}}
  .mbox{flex:none}
  .bubble{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;position:relative;font-weight:800;line-height:1.3}
  .bubble small{display:block;font-weight:700;color:var(--muted);font-size:13px;margin-top:2px}
  .bubble.left::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

  /* ----- topo ----- */
  .appbar{display:flex;align-items:center;gap:8px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:6;border-bottom:2px solid var(--line)}
  .logo{font-weight:800;font-size:28px;flex:1;line-height:1}
  .logo span{color:var(--accent)}
  .chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:900;font-size:14px;white-space:nowrap}

  /* ----- início ----- */
  .hello{display:flex;align-items:center;gap:12px;margin:16px 16px 4px}
  .hello .mbox{width:92px;height:92px;cursor:pointer}
  .next{margin:14px 16px 0;background:var(--accent);color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 var(--accent-d);width:calc(100% - 32px);text-align:left}
  .next:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-d)}
  .next .ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
  .next small{display:block;font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .next b{font-size:19px;font-family:"Baloo 2";line-height:1.1}
  .next .g{font-size:14px;opacity:.92;display:block;margin-top:2px}
  .revbtn{margin:12px 16px 0;display:flex;gap:12px;align-items:center;width:calc(100% - 32px);text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px}
  .revbtn .n{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px}
  .revbtn b{display:block}.revbtn span{font-size:13px;color:var(--muted)}

  /* ----- mapa ----- */
  .block{margin:24px 16px 8px}
  .bhead{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
  .lvl{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--accent)}
  .bhead h2{font-size:24px;margin:6px 0 0;line-height:1.1}
  .bhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
  .pbar{height:12px;background:var(--tint);border-radius:99px;overflow:hidden;margin-top:12px}
  .pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
  .pcount{font-size:13px;font-weight:800;color:var(--muted);margin-top:6px}
  .path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 0 6px}
  .node{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
  .node .c{width:72px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--accent);box-shadow:0 6px 0 var(--accent-d);transition:transform .1s}
  .node:active .c{transform:translateY(3px)}
  .node.done .c{background:var(--card);border:3px solid var(--accent);box-shadow:0 6px 0 var(--line2);color:var(--accent);font-weight:900}
  .node.locked .c{background:var(--tint);box-shadow:0 6px 0 var(--line2);font-size:22px}
  .node.locked{cursor:not-allowed}
  .node .lb{font-weight:800;font-size:14px;text-align:center;max-width:180px;line-height:1.15}
  .node .lb small{display:block;font-weight:700;color:var(--muted);font-size:12px}
  .node .st{font-size:13px;color:var(--accent);letter-spacing:1px;height:15px}
  .node .go{position:absolute;top:-28px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:900;font-size:12px;color:var(--accent);letter-spacing:.08em;animation:bob 1.4s ease-in-out infinite}
  .node.cur .c{outline:4px solid var(--soft);outline-offset:4px}
  .soon{margin:12px 16px;display:flex;gap:14px;align-items:center;background:transparent;border:2px dashed var(--line2);border-radius:16px;padding:12px 14px;color:var(--muted)}
  .soon .e{font-size:24px;filter:grayscale(1);opacity:.6}
  .soon b{display:block;color:var(--ink);opacity:.7}
  .soon span{font-size:13px}

  /* ----- barra inferior ----- */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:var(--bg);border-top:2px solid var(--line);z-index:9;padding:6px 6px 10px}
  .nav button{flex:1;padding:7px 0;border-radius:12px;font-weight:900;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
  .nav button .i{font-size:21px;filter:grayscale(1);opacity:.55}
  .nav button .mi{width:26px;height:26px}
  .nav button.on{color:var(--accent);background:var(--soft)}
  .nav button.on .i{filter:none;opacity:1}

  /* ----- telas de painel ----- */
  .pad{padding:16px}
  .h1{font-size:28px;margin:4px 4px 12px;line-height:1.1}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px}
  .card b{display:block;font-size:24px;font-family:"Baloo 2";line-height:1.1}
  .card span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
  .big{grid-column:1/-1;display:flex;align-items:center;gap:16px}
  .ring{width:84px;height:84px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px}
  .ring i{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal}
  .chart{display:flex;align-items:flex-end;gap:8px;height:110px}
  .chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .chart i{width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.9}
  .chart small{font-size:11px;color:var(--muted);font-weight:800}
  .chart em{font-size:10px;font-style:normal;font-weight:900;color:var(--accent)}
  .list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
  .row .grow{flex:1}.row small{color:var(--muted);display:block}
  .tag{font-weight:900;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
  .stitle{font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 4px 4px}
  .empty{color:var(--muted);font-size:14px;padding:8px 4px;margin:0}
  .ach{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .ach div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center}
  .ach div.on{border-color:var(--accent);background:var(--soft)}
  .ach div.off{opacity:.5;filter:grayscale(1)}
  .ach .e{font-size:32px}.ach b{display:block;font-size:14px;margin-top:4px}.ach span{font-size:12px;color:var(--muted)}

  /* ----- escolha de mascote ----- */
  .pick{padding:18px 16px 140px}
  .pick h1{font-size:30px;margin:0;line-height:1.1;text-align:center}
  .pick .sub{text-align:center;color:var(--muted);margin:4px 0 14px}
  .preview{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;min-height:128px}
  .preview .mbox{width:104px;height:104px}
  .preview .who{font-family:"Baloo 2";font-size:24px;font-weight:800;line-height:1}
  .preview .per{font-size:14px;color:var(--muted);margin:2px 0 8px}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .mcard{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:10px 6px 8px;text-align:center;transition:transform .1s}
  .mcard:active{transform:translateY(2px)}
  .mcard .mbox{width:76px;height:76px;margin:0 auto}
  .mcard b{display:block;font-family:"Baloo 2";font-size:18px;line-height:1.1}
  .mcard span{font-size:12px;color:var(--muted);font-weight:700}
  .mcard .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .mcard.sel{border-color:var(--accent);background:var(--soft)}
  @media (max-width:380px){.mgrid{grid-template-columns:repeat(2,1fr)}}

  /* ----- lição ----- */
  .top{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
  .x{font-size:24px;color:var(--muted);padding:4px 8px}
  .bar{flex:1;height:14px;background:var(--tint);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s ease}
  .qcount{font-weight:900;color:var(--muted);font-size:14px;min-width:34px;text-align:right}
  .page{padding:4px 20px 150px;font-size:17px;line-height:1.55}
  .kicker{font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .page h2{font-size:30px;line-height:1.05;margin:4px 0 2px}
  .page .ptitle{color:var(--muted);font-size:15px;margin:0 0 12px}
  .goal{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 12px;margin:0 0 16px;font-weight:800;font-size:15px}
  .goal small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:900}
  .ex{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 12px;margin:0 0 8px;display:flex;gap:10px;align-items:center}
  .ex .en{font-weight:800}
  .ex .pt{display:block;font-size:14px;color:var(--muted);line-height:1.35}
  .tip{background:var(--card);border:2px dashed var(--line2);border-radius:14px;padding:11px 13px;margin:14px 0;font-size:15px}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .spk{flex:none;background:var(--soft);color:var(--accent);width:34px;height:34px;border-radius:50%;font-size:15px}
  .say{display:flex;gap:10px;align-items:center;margin:0 0 16px}
  .say .mbox{width:70px;height:70px}
  .say .bubble{flex:1;font-weight:700}
  .dlg{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
  .dl{display:flex;gap:8px;align-items:flex-end}
  .dl.me{flex-direction:row-reverse}
  .av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;background:#8A847A}
  .dl.me .av{background:var(--accent)}
  .dl .b{max-width:80%;background:var(--card);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:7px 10px;font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center}
  .dl.me .b{background:var(--soft);border-color:transparent;border-radius:16px 16px 4px 16px}
  .dl .b .spk{width:28px;height:28px;font-size:13px}
  .q{padding:4px 18px 200px}
  .qhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
  .qm{flex:none;width:54px;height:54px;margin:-8px 0 -6px}
  .q .type{font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .sit{background:var(--tint);border-radius:12px;padding:9px 12px;font-size:15px;margin:10px 0 12px;display:flex;gap:8px;font-weight:700}
  .q h3{font-size:24px;line-height:1.2;margin:6px 0 14px}
  .q .sent{font-size:19px;font-weight:800;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:14px;display:flex;gap:10px;align-items:center}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 15px;text-align:left;font-size:17px;font-weight:800;transition:transform .08s}
  .opt:active{transform:translateY(2px)}
  .opt.sel{border-color:var(--accent);background:var(--soft)}
  .opt.good{border-color:var(--ok);background:var(--ok-l)}
  .opt.bad{border-color:var(--no);background:var(--no-l)}
  .opt:disabled{cursor:default}
  .slot{min-height:60px;border-bottom:2px solid var(--line2);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 12px;margin-bottom:20px;align-content:flex-start}
  .bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .w{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 13px;font-size:17px;font-weight:800}
  .w.used{visibility:hidden}
  .pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pairs .opt{text-align:center;font-size:15px;padding:13px 6px}
  .pairs .opt.done{opacity:.4;border-color:var(--ok);background:var(--ok-l)}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;padding:12px 16px 16px;background:var(--bg);border-top:2px solid var(--line);z-index:10}
  .foot.ok{background:var(--ok-l);border-color:var(--ok)}
  .foot.no{background:var(--no-l);border-color:var(--no)}
  .fb{display:none;gap:10px;align-items:flex-start;margin-bottom:12px}
  .foot.ok .fb,.foot.no .fb{display:flex;animation:in .25s}
  .fb .mbox{width:64px;height:64px;margin-top:-4px}
  .fb .h{font-family:"Baloo 2";font-size:19px;line-height:1.15;display:block}
  .foot.ok .fb .h{color:var(--ok)} .foot.no .fb .h{color:var(--no)}
  .fb .pt{font-size:13px;color:var(--muted);display:block}
  .fb p{margin:6px 0 0;font-size:15px;line-height:1.4}
  .btn{width:100%;padding:14px;border-radius:14px;font-size:17px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--accent);box-shadow:0 4px 0 var(--accent-d)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
  .btn:disabled{background:#CFC9BE;box-shadow:0 4px 0 #B5AEA2;cursor:default}
  .foot.ok .btn{background:var(--ok);box-shadow:0 4px 0 #1F5536}
  .foot.no .btn{background:var(--no);box-shadow:0 4px 0 #7F3127}
  .btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line2);border:2px solid var(--line)}
  /* incentivo e conclusão */
  .pep{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px 140px}
  .pep .mbox{width:170px;height:170px}
  .pep .bubble{font-size:20px;max-width:380px;margin-top:10px}
  .pep .bubble::before{content:"";position:absolute;left:50%;top:-9px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
  .pep .meta{margin-top:14px;color:var(--muted);font-weight:800;font-size:14px}
  .end{padding:22px 20px 190px;text-align:center}
  .end .mbox{width:150px;height:150px;margin:0 auto}
  .end h2{font-size:32px;margin:4px 0 0;line-height:1.05}
  .end .sub{color:var(--muted);font-weight:700}
  .end .bubble{display:inline-block;margin-top:10px}
  .end .st{font-size:34px;color:var(--accent);letter-spacing:6px;margin:8px 0 6px}
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cards3 .card{padding:10px 4px}.cards3 b{font-size:21px}
  .done-goal{margin-top:12px;background:var(--soft);border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;font-size:15px}
  .done-goal small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:900}
  .xpl{text-align:left;margin-top:12px}
  .xpl div{display:flex;justify-content:space-between;font-size:14px;padding:5px 2px;border-bottom:1px dashed var(--line2);font-weight:700}
  .xpl div b{color:var(--accent)}
  .bprog{margin-top:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px}
  .bprog .t{font-weight:900;font-size:14px}
  .bprog .steps{display:flex;gap:6px;margin-top:10px}
  .bprog .steps i{flex:1;height:10px;border-radius:99px;background:var(--tint)}
  .bprog .steps i.on{background:var(--accent)}
  .bprog .n{font-size:13px;color:var(--muted);margin-top:8px}
  .newach{margin-top:12px;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:11px;text-align:left;font-size:14px}
  .newach b{display:block;font-size:15px}
  .confetti{position:fixed;top:-12px;width:9px;height:13px;z-index:50;pointer-events:none;animation:fall linear forwards;border-radius:2px}

/* mensagens sem repetir em sequência */
const _bags = {};
function mascotLine(id, mood){
  const key = id+":"+mood, list = MASCOTS[id].msgs[mood] || MASCOTS[id].msgs.encourage;
  if (!_bags[key] || !_bags[key].length){ _bags[key] = list.map((_,i)=>i).sort(()=>Math.random()-.5); }
  return list[_bags[key].pop()];
}

/* aplica o tema do mascote nas variáveis de cor do app */
function applyTheme(id){
  const p = MASCOTS[id] ? MASCOTS[id].pal : {accent:"#4A4740", accentD:"#2E2C27", soft:"#EEEBE5", body:"#BDB7AC"};
  const r = document.documentElement.style;
  r.setProperty("--accent", p.accent); r.setProperty("--accent-d", p.accentD);
  r.setProperty("--soft", p.soft); r.setProperty("--mbody", p.body);
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = "#F7F5F0";
}

    /* ROKI — guaxinim gordinho e redondo, máscara, orelhas redondas, cauda listrada enorme */
    roki: {
      colors:{body:"#E9877A", belly:"#FCEEEA", line:"#8A3A31", iris:"#3A2522", extra:"#5B3B37"},
      eyes:[[66,68],[94,68]], er:8.5, mouth:[80,92,9], brow:{w:3, base:"mischief", color:"#FFF4F1"},
      arms:{L:[48,112], R:[112,112], len:18, w:12}, hat:[80,28,0], think:[122,36], tear:[60,82],
      back:c=>`
        <clipPath id="${c.id}tail"><path d="M50 132 C14 136 0 104 16 78 C22 70 34 74 30 84 C22 104 34 120 54 118 Z"/></clipPath>
        <path d="M50 132 C14 136 0 104 16 78 C22 70 34 74 30 84 C22 104 34 120 54 118 Z" fill="${c.g}"/>
        <g clip-path="url(#${c.id}tail)" fill="${c.extra}"><rect x="0" y="80" width="40" height="8" transform="rotate(-24 20 84)"/><rect x="2" y="98" width="40" height="8" transform="rotate(-10 22 102)"/><rect x="12" y="116" width="40" height="8" transform="rotate(14 32 120)"/></g>
        <path d="M50 132 C14 136 0 104 16 78 C22 70 34 74 30 84 C22 104 34 120 54 118 Z" fill="none" stroke="${c.line}" stroke-width="2.6"/>

        <circle cx="50" cy="41" r="6.5" fill="${c.extra}"/><circle cx="110" cy="41" r="6.5" fill="${c.extra}"/>`,
      body:c=>`
        <ellipse cx="80" cy="112" rx="40" ry="33" fill="${c.g}" stroke="${c.line}" stroke-width="2.8"/>
        <ellipse cx="80" cy="118" rx="24" ry="20" fill="${c.belly}"/>
        <path d="M80 36 C108 36 122 52 122 70 C122 74 128 78 126 82 C118 84 116 92 106 94 C98 98 90 99 80 99 C70 99 62 98 54 94 C44 92 42 84 34 82 C32 78 38 74 38 70 C38 52 52 36 80 36 Z" fill="${c.g}" stroke="${c.line}" stroke-width="2.8" stroke-linejoin="round"/>
        <path d="M46 68 Q56 54 72 62 Q80 66 88 62 Q104 54 114 68 Q110 82 96 78 Q80 74 64 78 Q50 82 46 68 Z" fill="${c.extra}"/>
        <ellipse cx="80" cy="88" rx="15" ry="10" fill="${c.belly}"/>
        <ellipse cx="80" cy="82" rx="5" ry="3.4" fill="${INK}"/>`,
      feet:c=>[[66,144],[94,144]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="12" ry="6.5" fill="${c.extra}" stroke="${c.line}" stroke-width="2.2"/>`).join("")
    }
  };

  /* ---------------- expressões ---------------- */
  const MOODS = {
    idle:      {eyes:"idle",  brow:"base",    mouth:"idle",  arms:"rest"},
    welcome:   {eyes:"idle",  brow:"base",    mouth:"smile", arms:"wave",  blush:1},
    happy:     {eyes:"happy", brow:"up",      mouth:"grin",  arms:"open",  blush:1},
    thinking:  {eyes:"look",  brow:"think",   mouth:"hmm",   arms:"chin",  fx:"dots"},
    surprised: {eyes:"wide",  brow:"high",    mouth:"o",     arms:"wide",  fx:"bang"},
    sad:       {eyes:"down",  brow:"worried", mouth:"sad",   arms:"close", fx:"tear"},
    excited:   {eyes:"wide",  brow:"high",    mouth:"grin",  arms:"up",    fx:"spark", blush:1},
    celebrate: {eyes:"happy", brow:"up",      mouth:"grin",  arms:"up",    fx:"party", blush:1},
    encourage: {eyes:"wink",  brow:"up",      mouth:"smile", arms:"thumb", blush:1}
  };
  MOODS.oops = MOODS.sad;

  function eyeOpen(x,y,r,c,o={}){
    const sx=o.scale||1, rx=r*.9*sx, ry=r*1.08*sx, ps=o.ps||1, dx=(o.dx||0)*r, dy=(o.dy||0)*r;
    const lid = o.lid ? `<path d="M${x-rx-1} ${y-ry*.42} Q${x} ${y-ry*.85} ${x+rx+1} ${y-ry*.42} L${x+rx+2} ${y-ry-3} L${x-rx-2} ${y-ry-3} Z" fill="${o.lid}"/><path d="M${x-rx} ${y-ry*.42} Q${x} ${y-ry*.85} ${x+rx} ${y-ry*.42}" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>` : "";
    return `<g class="eye"><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" stroke="${INK}" stroke-width="2"/>
      <circle cx="${x+dx}" cy="${y+dy}" r="${r*.62*ps}" fill="url(#${c.id}iris)"/>
      <circle cx="${x+dx}" cy="${y+dy}" r="${r*.32*ps}" fill="${INK}"/>
      <circle cx="${x+dx+r*.24}" cy="${y+dy-r*.3}" r="${r*.2}" fill="#fff"/><circle cx="${x+dx-r*.22}" cy="${y+dy+r*.22}" r="${r*.09}" fill="#fff"/>${lid}</g>`;
  }
  const eyeArc = (x,y,r)=>`<path d="M${x-r*.85} ${y+r*.3} Q${x} ${y-r*.8} ${x+r*.85} ${y+r*.3}" stroke="${INK}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  function eyes(ch,c,kind,lidColor){
    return ch.eyes.map(([x,y],i)=>{
      const r=ch.er;
      if (kind==="happy" || (kind==="wink" && i===1)) return eyeArc(x,y,r);
      if (kind==="wide") return eyeOpen(x,y,r,c,{scale:1.12, ps:.78});
      if (kind==="look") return eyeOpen(x,y,r,c,{dx:-.28, dy:-.3});
      if (kind==="down") return eyeOpen(x,y,r,c,{dy:.26});
      return eyeOpen(x,y,r,c,{lid: ch.sly ? lidColor : null});
    }).join("");
  }
  function brows(ch,c,kind){
    const b=ch.brow; if (b.base==="none" && !["worried","think","high"].includes(kind)) return "";
    if (kind==="base") kind=b.base;
    const col=b.color||c.line;
    return ch.eyes.map(([x,y],i)=>{
      const r=ch.er, by=y-r*1.6, x1=x-r*.75, x2=x+r*.75, inL=i===0;
      let y1=by, y2=by, q=-3;
      if (kind==="determined"){ y1=inL?by-2:by+3; y2=inL?by+3:by-2; q=-1; }
      if (kind==="sly"){ y1=inL?by:by-3; y2=inL?by-3:by; q=-2; }
      if (kind==="mischief"){ y1=inL?by-1:by+2; y2=inL?by+2:by-3; }
      if (kind==="up"||kind==="soft"){ y1=by-2; y2=by-2; }
      if (kind==="high"){ y1=by-6; y2=by-6; q=-4; }
      if (kind==="worried"){ y1=inL?by+2:by-4; y2=inL?by-4:by+2; q=-1; }
      if (kind==="think"){ if(i===0){ y1=by-6; y2=by-7; q=-4; } else { y1=by+1; y2=by+1; q=0; } }
      return `<path d="M${x1} ${y1} Q${x} ${Math.min(y1,y2)+q} ${x2} ${y2}" stroke="${col}" stroke-width="${b.w}" fill="none" stroke-linecap="round"/>`;
    }).join("");
  }
  function mouth(ch,kind){
    const [x,y,w]=ch.mouth;
    if (kind==="idle" && ch.sly) return `<path d="M${x-w} ${y} Q${x-1} ${y+w*.7} ${x+w} ${y-3}" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if (kind==="idle"||kind==="smile") return `<path d="M${x-w} ${y} Q${x} ${y+w*.85} ${x+w} ${y}" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if (kind==="grin") return `<path d="M${x-w} ${y-1} Q${x} ${y+w*1.5} ${x+w} ${y-1} Q${x} ${y+w*.25} ${x-w} ${y-1} Z" fill="${INK}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M${x-w*.5} ${y+w*.75} Q${x} ${y+w*.45} ${x+w*.5} ${y+w*.75} Q${x} ${y+w*1.12} ${x-w*.5} ${y+w*.75} Z" fill="#E9797B"/>`;
    if (kind==="o") return `<ellipse cx="${x}" cy="${y+4}" rx="${Math.min(w*.42,8)}" ry="${Math.min(w*.55,9)}" fill="${INK}"/><ellipse cx="${x}" cy="${y+8}" rx="${Math.min(w*.25,4.5)}" ry="2.5" fill="#E9797B"/>`;
    if (kind==="hmm") return `<path d="M${x-w*.4+3} ${y+3} Q${x+3} ${y+6} ${x+w*.45+3} ${y+1}" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if (kind==="sad") return `<path d="M${x-w*.55} ${y+6} Q${x} ${y+1} ${x+w*.55} ${y+6}" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    return "";
  }
  function arm(sx,sy,deg,len,w,c,cls=""){
    return `<g class="${cls}" style="transform-origin:${sx}px ${sy}px"><g transform="rotate(${deg} ${sx} ${sy})">
      <rect x="${sx-w/2}" y="${sy-w/2}" width="${w}" height="${len+w/2}" rx="${w/2}" fill="${c.g}" stroke="${c.line}" stroke-width="2.4"/>
      <circle cx="${sx}" cy="${sy+len}" r="${w*.62}" fill="${c.g}" stroke="${c.line}" stroke-width="2.4"/></g></g>`;
  }
  const aim = (sx,sy,tx,ty)=>Math.atan2(-(tx-sx), ty-sy)*180/Math.PI;
  function arms(ch,c,pose){
    const {L,R,len,w}=ch.arms; let a=20, b=-20, extra="", clsR="";
    if (pose==="rest" && ch.rest==="front"){ a=aim(L[0],L[1],76,L[1]+14); b=aim(R[0],R[1],84,R[1]+14); }
    else if (pose==="rest"){ a=22; b=-22; }
    if (pose==="close"){ a=10; b=-10; }
    if (pose==="open"){ a=55; b=-55; }
    if (pose==="wide"){ a=115; b=-115; }
    if (pose==="up"){ a=155; b=-155; }
    if (pose==="wave"){ b=-150; clsR="arm-wave"; }
    if (pose==="chin"){ const [mx,my]=ch.mouth; b=aim(R[0],R[1],mx+6,my+8); }
    if (pose==="thumb"){ b=-128;
      const t=b*Math.PI/180, hx2=R[0]-Math.sin(t)*len, hy2=R[1]+Math.cos(t)*len;
      extra=`<rect x="${hx2-w*.24}" y="${hy2-w*1.3}" width="${w*.48}" height="${w*.95}" rx="${w*.24}" fill="${c.g}" stroke="${c.line}" stroke-width="2.2"/>`; }
    return arm(L[0],L[1],a,len,w,c) + arm(R[0],R[1],b,len,w,c,clsR) + extra;
  }
  function fx(ch,c,kind,accent){
    const [tx,ty]=ch.think;
    if (kind==="dots") return `<g class="dots"><circle cx="${tx-14}" cy="${ty+14}" r="3" fill="#fff" stroke="${INK}" stroke-width="1.8"/><circle cx="${tx-6}" cy="${ty+5}" r="4.5" fill="#fff" stroke="${INK}" stroke-width="1.8"/><circle cx="${tx+6}" cy="${ty-6}" r="7" fill="#fff" stroke="${INK}" stroke-width="1.8"/></g>`;
    if (kind==="bang") return `<g class="bang"><path d="M${tx} ${ty-12} L${tx-3} ${ty+4} L${tx+3} ${ty+4} Z" fill="${accent}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${tx}" cy="${ty+10}" r="2.8" fill="${accent}" stroke="${INK}" stroke-width="1.6"/></g>`;
    if (kind==="tear"){ const [x,y]=ch.tear; return `<path class="tear" d="M${x} ${y} q4 7 0 10 q-4 -3 0 -10z" fill="#A9CDEB" stroke="#6E9CC4" stroke-width="1.2"/>`; }
    if (kind==="spark"||kind==="party"){
      const st=(x,y,s)=>`<path d="M${x} ${y-s} L${x+s*.3} ${y-s*.3} L${x+s} ${y} L${x+s*.3} ${y+s*.3} L${x} ${y+s} L${x-s*.3} ${y+s*.3} L${x-s} ${y} L${x-s*.3} ${y-s*.3} Z" fill="${accent}"/>`;
      let s = `<g class="spark">${st(18,40,8)}${st(142,30,6)}${st(146,86,4)}${st(14,94,4)}</g>`;
      if (kind==="party") s += `<g class="confetti-bits">${[[30,20,"#F2C14E",20],[128,14,accent,-30],[150,58,"#7CC2E8",40],[10,66,accent,10],[136,112,"#F2C14E",-20],[22,120,"#7CC2E8",30]].map(([x,y,f,r])=>`<rect x="${x}" y="${y}" width="7" height="4" rx="1" fill="${f}" transform="rotate(${r} ${x} ${y})"/>`).join("")}</g>`;
      return s;
    }
    return "";
  }

  /* ---------------- acessórios (prontos para itens cosméticos futuros) ---------------- */
  const ACCESSORIES = {
    partyHat: (ch,c,accent)=>{ const [x,y,r]=ch.hat; return `<g class="acc" transform="rotate(${r} ${x} ${y})">
      <path d="M${x} ${y-30} L${x-14} ${y+2} Q${x} ${y+7} ${x+14} ${y+2} Z" fill="${accent}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M${x-9} ${y-8} L${x+9} ${y-12} M${x-12} ${y-1} L${x+12} ${y-5}" stroke="#fff" stroke-width="2.4" opacity=".75" stroke-linecap="round"/>
      <circle cx="${x}" cy="${y-31}" r="4.5" fill="#F2C14E" stroke="${INK}" stroke-width="1.8"/></g>`; }
  };

  /* reflexo de luz: um arco claro no alto da cabeça, igual em todos */
  const SHINE = {dino:[52,52,30], lumi:[50,56,28], foxy:[48,60,26], miko:[56,42,20], bloop:[34,98,30], roki:[50,56,24]};
  function shine(ch){ const id=Object.keys(CH).find(k=>CH[k]===ch), s=SHINE[id]; if(!s) return "";
    const [x,y,l]=s; return `<path d="M${x} ${y+l*.5} Q${x+2} ${y} ${x+l*.6} ${y-l*.25}" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".45"/>`; }

  function render(id, mood="idle", opts={}){
    const ch = CH[id]; if (!ch) return "";
    const m = MOODS[mood] || MOODS.idle;
    const accent = (typeof MASCOTS!=="undefined" && MASCOTS[id]) ? MASCOTS[id].pal.accent : ch.colors.line;
    const k = "m"+(++uid)+"_";
    const c = {...ch.colors, id:k, g:`url(#${k}body)`};
    const defs = `<defs>
      <radialGradient id="${k}body" cx="34%" cy="26%" r="85%"><stop offset="0" stop-color="${W(c.body,.38)}"/><stop offset=".5" stop-color="${c.body}"/><stop offset="1" stop-color="${K(c.body,.16)}"/></radialGradient>
      <radialGradient id="${k}iris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="${W(c.iris,.35)}"/><stop offset="1" stop-color="${K(c.iris,.2)}"/></radialGradient>
      <radialGradient id="${k}glow"><stop offset="0" stop-color="${W(c.body,.5)}" stop-opacity=".55"/><stop offset="1" stop-color="${c.body}" stop-opacity="0"/></radialGradient></defs>`;
    const acc = (opts.accessories||[]).concat(m.fx==="party"?["partyHat"]:[]).map(a=>ACCESSORIES[a]?ACCESSORIES[a](ch,c,accent):"").join("");
    const blush = m.blush ? ch.eyes.map(([x,y],i)=>`<ellipse cx="${x+(i?ch.er*.6:-ch.er*.6)}" cy="${y+ch.er*1.45}" rx="${ch.er*.55}" ry="${ch.er*.32}" fill="#F28B8B" opacity=".38"/>`).join("") : "";
    const shadow = `<ellipse class="shadow" cx="80" cy="${ch.float?154:150}" rx="${ch.float?30:40}" ry="5" fill="${INK}" opacity=".12"/>`;
    return `<svg class="msvg mood-${mood} sp-${id}${ch.float?" floaty":""}" viewBox="0 0 160 160" role="img" aria-label="${(typeof MASCOTS!=="undefined"&&MASCOTS[id]?MASCOTS[id].name:id)}">
      ${defs}${shadow}<g class="whole">
        ${ch.back(c)}${ch.feet(c)}${ch.body(c)}${shine(ch)}
        ${brows(ch,c,m.brow)}${eyes(ch,c,m.eyes,ch.colors.body)}${blush}${mouth(ch,m.mouth)}
        ${arms(ch,c,m.arms)}${fx(ch,c,m.fx,accent)}${acc}
      </g></svg>`;
  }
  return {render, MOODS, CHARACTERS:CH, ACCESSORIES};
})();
function mascotSVG(id, mood="idle", opts={}){ return MascotArt.render(id, mood, opts); }

/* ================== estrutura do curso ================== */
const MAIN = [BLOCK1];                        // novos blocos entram aqui, em ordem de dificuldade
const PEP_EVERY = 5;                          // mascote incentiva a cada 5 exercícios
const PHASES = {};
MAIN.forEach(b=>b.phases.forEach((p,i)=>PHASES[p.id]={p, b, i}));
const QUESTIONS = {};
Object.values(PHASES).forEach(({p})=>p.questions.forEach((q,k)=>QUESTIONS[p.id+":"+k]={...q, qid:p.id+":"+k, from:p}));
const MAIN_PHASES = MAIN.flatMap(b=>b.phases);

/* ================== progresso salvo (neste aparelho) ================== */
const KEY = "blurty-v2";
const fresh = ()=>({profile:{mascot:null, skin:null, accessories:[]}, phases:{}, xp:0, streak:0, best:0, last:null,
                     days:{}, history:[], review:{}, achieved:{}, stats:{answered:0, correct:0, cleared:0}});
let S = fresh(), storageOK = true;
try{ const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); }catch(e){ storageOK = false; }
S.stats = Object.assign({answered:0, correct:0, cleared:0}, S.stats);
S.profile = Object.assign({mascot:null, skin:null, accessories:[]}, S.profile);
if (S.profile.mascot && !MASCOTS[S.profile.mascot]) S.profile.mascot = null;
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOK = false; } }

const dayStr = (d=new Date())=>{ const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
function streakNow(){ if(!S.last) return 0; const y=dayStr(new Date(Date.now()-864e5)); return (S.last===dayStr()||S.last===y)?S.streak:0; }
function touchDay(){ const t=dayStr(); if(S.last===t) return false; const y=dayStr(new Date(Date.now()-864e5));
  S.streak=(S.last===y)?S.streak+1:1; S.last=t; S.best=Math.max(S.best||0,S.streak); return true; }

/* ================== utilidades ================== */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => s.toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();
const done = id => !!(S.phases[id] && S.phases[id].stars);
const starsTxt = n => "★".repeat(n)+"☆".repeat(3-n);
const M = ()=>S.profile.mascot;
const mbox = (mood, id=M(), extra="") => `<div class="mbox" ${extra}>${mascotSVG(id, mood, {accessories:S.profile.accessories})}</div>`;

let actx;
function tone(freqs){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f;
    const t=actx.currentTime+i*.09; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.14,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.25); }); }catch(e){} }
const sfx = {ok:()=>tone([660,880]), no:()=>tone([330,262]), tap:()=>tone([520]), win:()=>tone([523,659,784,1046])};
function speak(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=.9; speechSynthesis.speak(u); }catch(e){} }
document.addEventListener("click", e=>{ const s=e.target.closest("[data-say]"); if(s){ e.stopPropagation(); speak(s.dataset.say); } });
function confetti(n=60){
  const cs = getComputedStyle(document.documentElement);
  const colors=[cs.getPropertyValue("--accent").trim(), cs.getPropertyValue("--mbody").trim(), "#D9D3C7", "#26241F"];
  for(let i=0;i<n;i++){ const d=document.createElement("div"); d.className="confetti"; d.style.left=Math.random()*100+"vw"; d.style.background=colors[i%colors.length];
    d.style.animationDuration=(1.6+Math.random()*1.6)+"s"; d.style.animationDelay=(Math.random()*.4)+"s"; document.body.appendChild(d); setTimeout(()=>d.remove(),3800); }
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const dialogHTML = lines => `<div class="dlg">${lines.map(([who,t])=>`<div class="dl ${who==="Você"?"me":""}"><div class="av">${esc(who[0])}</div><div class="b"><button class="spk" data-say="${esc(t)}" aria-label="Ouvir">🔊</button><span>${esc(t)}</span></div></div>`).join("")}</div>`;

/* ================== progresso / desbloqueio ================== */
function unlocked(id){ const idx=MAIN_PHASES.findIndex(p=>p.id===id); return idx===0 || done(MAIN_PHASES[idx-1].id); }
function nextActivity(){
  const p = MAIN_PHASES.find(p=>!done(p.id));
  if (p) return {type:"phase", p};
  if (Object.keys(S.review).length) return {type:"review"};
  return {type:"all"};
}
const overallPct = ()=>Math.round(MAIN_PHASES.filter(p=>done(p.id)).length/MAIN_PHASES.length*100);
const accuracy = ()=>S.stats.answered?Math.round(S.stats.correct/S.stats.answered*100):0;

const ACH = [
  {id:"first",  e:"🌱", t:"Primeiro passo",     d:"Conclua sua primeira fase",    ok:()=>Object.keys(S.phases).length>=1},
  {id:"perfect",e:"🎯", t:"Sem erros",           d:"Conclua uma fase sem errar",   ok:()=>Object.values(S.phases).some(x=>x.stars===3)},
  {id:"b1",     e:"👋", t:"First Conversations", d:"Conclua o Bloco 1",           ok:()=>BLOCK1.phases.every(p=>done(p.id))},
  {id:"ten",    e:"✍️", t:"10 exercícios",       d:"Responda 10 exercícios",       ok:()=>S.stats.answered>=10},
  {id:"st3",    e:"🔥", t:"3 dias seguidos",     d:"Estude 3 dias em sequência",   ok:()=>(S.best||0)>=3},
  {id:"st7",    e:"🏅", t:"Uma semana",          d:"Estude 7 dias em sequência",   ok:()=>(S.best||0)>=7},
  {id:"rev5",   e:"🔁", t:"Revisor",             d:"Acerte 5 itens na revisão",    ok:()=>S.stats.cleared>=5},
  {id:"xp300",  e:"⚡", t:"300 XP",              d:"Alcance 300 XP",               ok:()=>S.xp>=300}
];
function checkAch(){ const out=[]; ACH.forEach(a=>{ if(!S.achieved[a.id]&&a.ok()){ S.achieved[a.id]=dayStr(); out.push(a);} }); return out; }

/* ================== escolha de mascote ================== */
function pickScreen(mode){ // mode: "first" | "change"
  let sel = mode==="change" ? M() : null;
  const ids = Object.keys(MASCOTS);
  function draw(){
    applyTheme(sel);
    const m = sel && MASCOTS[sel];
    const line = sel ? mascotLine(sel,"welcome") : null;
    app.innerHTML = `<div class="screen pick">
      <h1>${mode==="first"?"Escolha seu companheiro":"Trocar mascote"}</h1>
      <p class="sub">${mode==="first"?"Ele vai te acompanhar em toda a jornada. Dá para trocar depois no Perfil.":"Seu XP, fases, conquistas e sequência continuam iguais."}</p>
      <div class="preview">${sel ? `${mbox("welcome", sel)}<div><div class="who">${m.name}</div><div class="per">${m.speciesPt} · ${m.colorPt}<br>${esc(m.personality)}</div>
          <div class="bubble" style="font-size:15px">“${esc(line[0])}”<small>${esc(line[1])}</small></div></div>`
        : `<div style="flex:1;text-align:center;color:var(--muted);font-weight:800">Toque em um mascote para conhecer 👇</div>`}</div>
      <div class="mgrid">${ids.map(id=>{ const x=MASCOTS[id]; return `<button class="mcard ${sel===id?"sel":""}" data-m="${id}" aria-pressed="${sel===id}">
          ${mbox(sel===id?"happy":"idle", id)}<b>${x.name}</b><span><i class="dot" style="background:${x.pal.accent}"></i>${x.speciesPt}</span></button>`;}).join("")}</div>
      <div class="foot">
        <button class="btn" id="ok" ${sel?"":"disabled"}>${sel?`Escolher ${MASCOTS[sel].name}`:"Escolha um mascote"}</button>
        ${mode==="change"?`<button class="btn ghost" id="cancel" style="margin-top:10px">Cancelar</button>`:""}
      </div></div>`;
    app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ sel=b.dataset.m; sfx.tap(); draw(); });
    document.getElementById("ok").onclick = ()=>{
      if(!sel) return;
      const changed = S.profile.mascot!==sel;
      S.profile.mascot = sel; persist(); applyTheme(sel); sfx.win();
      if (changed) confetti(40);
      tab = mode==="first" ? "map" : "me"; greet = true; render(); window.scrollTo(0,0);
    };
    const c = document.getElementById("cancel"); if (c) c.onclick = ()=>{ applyTheme(M()); tab="me"; render(); };
  }
  draw();
}

/* ================== telas principais ================== */
let tab = "map", greet = true;
function appbar(){
  return `<div class="appbar"><div class="logo">Blurty<span>.</span></div>
    <span class="chip" title="Dias seguidos">🔥 ${streakNow()}</span><span class="chip" title="XP">⚡ ${S.xp}</span><span class="chip" title="Progresso geral">${overallPct()}%</span></div>`;
}
function nav(){
  const b=(id,i,l)=>`<button class="${tab===id?"on":""}" data-tab="${id}">${i}${l}</button>`;
  return `<div class="nav">${b("map",'<span class="i">🗺️</span>',"Aprender")}${b("prog",'<span class="i">📈</span>',"Progresso")}${b("ach",'<span class="i">🏆</span>',"Conquistas")}${b("me",`<span class="mi">${mascotSVG(M(),"idle")}</span>`,"Perfil")}</div>`;
}
function bindNav(){ app.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{ tab=x.dataset.tab; sfx.tap(); render(); window.scrollTo(0,0); }); }
function render(){
  if (!M()) return pickScreen("first");
  applyTheme(M());
  ({map:mapScreen, prog:progScreen, ach:achScreen, me:meScreen})[tab]();
}

function mapScreen(){
  const nx = nextActivity();
  const mood = greet ? "welcome" : "encourage";
  const line = mascotLine(M(), mood); greet = false;
  let next = "";
  if (nx.type==="phase"){ const {b,i}=PHASES[nx.p.id];
    next = `<button class="next" id="next"><span class="ic">${nx.p.emoji}</span><span><small>Próxima · ${esc(b.title)} · fase ${i+1}</small><b>${esc(nx.p.title)}</b><span class="g">🎯 ${esc(nx.p.goal)}</span></span></button>`;
  } else if (nx.type==="review"){
    next = `<button class="next" id="next"><span class="ic">🔁</span><span><small>Próxima atividade</small><b>Revisão</b><span class="g">Reforce ${Object.keys(S.review).length} item(ns) que você errou</span></span></button>`;
  }
  const rc = Object.keys(S.review).length;
  const blocks = MAIN.map((b,bi)=>{
    const n=b.phases.filter(p=>done(p.id)).length, offs=[0,56,76,36,-30];
    return `<div class="block"><div class="bhead"><span class="lvl">Bloco ${bi+1} · ${b.level}</span><h2>${b.emoji} ${esc(b.title)}</h2><p>${esc(b.goal)}</p>
        <div class="pbar"><i style="width:${n/b.phases.length*100}%"></i></div><div class="pcount">${n} de ${b.phases.length} fases${n===b.phases.length?" · bloco completo 🎉":""}</div></div>
      <div class="path">${b.phases.map((p,i)=>{ const ul=unlocked(p.id), d=done(p.id), cur=nx.type==="phase"&&nx.p.id===p.id;
        return `<button class="node ${d?"done":""} ${ul?"":"locked"} ${cur?"cur":""}" data-ph="${p.id}" style="transform:translateX(${offs[i%offs.length]}px)">
          ${cur?`<span class="go">START</span>`:""}<span class="c">${ul?(d?"✓":p.emoji):"🔒"}</span><span class="st">${d?starsTxt(S.phases[p.id].stars):""}</span>
          <span class="lb">${esc(p.title)}<small>Fase ${i+1} · ${esc(p.pt)}</small></span></button>`;}).join("")}</div></div>`;
  }).join("");
  const soon = UPCOMING.map((u,i)=>`<div class="soon"><span class="e">${u.emoji}</span><div><b>Bloco ${MAIN.length+i+1} · ${esc(u.title)}</b><span>${u.level} · ${esc(u.pt)} · em breve</span></div></div>`).join("");
  app.innerHTML = `<div class="screen">${appbar()}
    <div class="hello">${mbox(mood, M(), 'id="mtap" title="Toque em mim"')}<div class="bubble left">${esc(line[0])}<small>${esc(line[1])}</small></div></div>
    ${next}
    ${rc && nx.type!=="review" ? `<button class="revbtn" id="rev"><span class="n">🔁</span><div><b>Revisão</b><span>${rc} item(ns) para reforçar · +8 XP cada</span></div></button>`:""}
    ${blocks}${soon}
    ${storageOK?"":`<p class="empty" style="margin:16px">⚠️ Este navegador não está salvando o progresso (modo anônimo?).</p>`}
  </div>${nav()}`;
  bindNav();
  const nb=document.getElementById("next"); if(nb) nb.onclick=()=>{ sfx.tap(); nx.type==="review"?startReview():startPhase(nx.p.id); };
  const rb=document.getElementById("rev"); if(rb) rb.onclick=()=>{ sfx.tap(); startReview(); };
  document.getElementById("mtap").onclick=()=>{ const l=mascotLine(M(),"happy"); const h=document.querySelector(".hello");
    h.innerHTML=`${mbox("happy",M(),'id="mtap"')}<div class="bubble left">${esc(l[0])}<small>${esc(l[1])}</small></div>`; sfx.ok();
    setTimeout(()=>{ const t=document.getElementById("mtap"); if(t) t.onclick=()=>mapScreen(); },50); };
  app.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{ const id=b.dataset.ph;
    if(!unlocked(id)){ b.classList.add("shake"); sfx.no(); setTimeout(()=>b.classList.remove("shake"),400); toast("Conclua a fase anterior para desbloquear"); return; }
    sfx.tap(); startPhase(id); });
}

  </div></div>${nav()}`;
  bindNav(); const r=document.getElementById("revgo"); if(r) r.onclick=()=>startReview();
}

  const n=ACH.filter(a=>S.achieved[a.id]).length;
  app.innerHTML = `<div class="screen">${appbar()}<div class="pad"><h1 class="h1">Conquistas <span style="font-size:18px;color:var(--muted)">${n}/${ACH.length}</span></h1>
    <div class="ach">${ACH.map(a=>`<div class="${S.achieved[a.id]?"on":"off"}"><div class="e">${a.e}</div><b>${esc(a.t)}</b><span>${esc(a.d)}${S.achieved[a.id]?`<br>✔ ${S.achieved[a.id].split("-").reverse().join("/")}`:""}</span></div>`).join("")}</div>
    <div class="stitle">Como ganhar XP</div>
    <div class="list">
      <div class="row"><div class="grow">Resposta certa</div><span class="tag">+10</span></div>
      <div class="row"><div class="grow">Concluir uma fase pela primeira vez</div><span class="tag">+20</span></div>
      <div class="row"><div class="grow">Fase sem erros</div><span class="tag">+10</span></div>
      <div class="row"><div class="grow">Primeira sessão do dia (sequência)</div><span class="tag">+5 por dia, até +35</span></div>
      <div class="row"><div class="grow">Acertar um item da revisão</div><span class="tag">+8</span></div>
      <div class="row"><div class="grow">Concluir um bloco</div><span class="tag">+100</span></div>
    </div><p class="empty">Não existe bônus por velocidade: o que conta é entender.</p></div></div>${nav()}`;
  bindNav();
}

function meScreen(){
  const m=MASCOTS[M()], line=mascotLine(M(),"encourage");
  app.innerHTML = `<div class="screen">${appbar()}<div class="pad"><h1 class="h1">Perfil</h1>
    <div class="card" style="text-align:center;padding:18px">
      <div style="width:150px;height:150px;margin:0 auto">${mascotSVG(M(),"welcome",{accessories:S.profile.accessories})}</div>
      <div class="disp" style="font-size:30px;font-weight:800;line-height:1">${m.name}</div>
      <div style="color:var(--muted);font-weight:800">${m.speciesPt} · ${m.colorPt}</div>
      <p style="margin:8px 0 12px">${esc(m.personality)}</p>
      <div class="bubble" style="display:inline-block">“${esc(line[0])}”<small>${esc(line[1])}</small></div>
      <button class="btn" id="chg" style="margin-top:16px">Trocar mascote</button>
    </div>
    <div class="stitle">Seus números</div>
    <div class="grid"><div class="card"><b>⚡ ${S.xp}</b><span>XP</span></div><div class="card"><b>🏆 ${ACH.filter(a=>S.achieved[a.id]).length}</b><span>Conquistas</span></div></div>
    <p class="empty" style="margin-top:14px">Trocar de mascote muda só o personagem e as cores. XP, fases, conquistas, histórico e sequência continuam.</p>
    <p class="empty">Seu progresso fica salvo neste aparelho e neste navegador.</p>
  </div></div>${nav()}`;
  bindNav(); document.getElementById("chg").onclick=()=>{ sfx.tap(); pickScreen("change"); };
}

/* ================== sessão ================== */
let L;
function startPhase(id){ const {p,b}=PHASES[id];
  L={mode:"phase", p, b, queue:p.questions.map((q,k)=>QUESTIONS[p.id+":"+k]), total:p.questions.length, n:0, mistakes:0, ok:0, xp:0}; learnCard(); }
function startReview(){
  const ids=shuffle(Object.keys(S.review).filter(id=>QUESTIONS[id])).slice(0,5);
  if(!ids.length){ toast("Nada para revisar agora 🎉"); return; }
  L={mode:"review", queue:ids.map(id=>QUESTIONS[id]), total:ids.length, n:0, mistakes:0, ok:0, xp:0, cleared:0}; nextQ();
}
function topBar(){ return `<div class="top"><button class="x" id="quit" aria-label="Sair">✕</button><div class="bar"><i style="width:${L.n/L.total*100}%"></i></div><div class="qcount">${Math.min(L.n+1,L.total)}/${L.total}</div></div>`; }
function quit(){ tab="map"; render(); window.scrollTo(0,0); }

function readingHTML(blocks){
  return blocks.map(x=>{
    if (x.say){ const who=x.say[0]==="@"?M():null;
      return `<div class="say">${who?mbox("welcome",who):`<div class="av">${esc(x.say[0][0])}</div>`}<div class="bubble left">${esc(x.say[1])} <button class="spk" data-say="${esc(x.say[1])}" aria-label="Ouvir" style="width:26px;height:26px;font-size:12px;vertical-align:middle">🔊</button>${x.pt?`<small>${esc(x.pt)}</small>`:""}</div></div>`; }
    if (x.dialog) return dialogHTML(x.dialog);
    if (x.p)   return `<p>${x.p}</p>`;
    if (x.tip) return `<div class="tip">${x.tip}</div>`;
    if (x.ex)  return `<div class="ex"><button class="spk" data-say="${esc(x.ex)}" aria-label="Ouvir">🔊</button><div><span class="en">${esc(x.ex)}</span>${x.pt?`<span class="pt">${esc(x.pt)}</span>`:""}</div></div>`;
    return "";
  }).join("");
}
function learnCard(){
  const {p,b}=L, i=PHASES[p.id].i;
  app.innerHTML = `<div class="screen">${topBar()}<div class="page">
      <div class="kicker">${esc(b.title)} · Fase ${i+1} de ${b.phases.length}</div>
      <h2>${p.emoji} ${esc(p.title)}</h2><div class="ptitle">${esc(p.pt)}</div>
      <div class="goal"><span>🎯</span><span><small>Objetivo desta fase</small>${esc(p.goal)}</span></div>
      ${readingHTML(p.reading)}<div class="hint">🔊 toque para ouvir a pronúncia</div></div>
    <div class="foot"><button class="btn" id="go">Praticar · ${p.questions.length} exercícios</button></div></div>`;
  document.getElementById("quit").onclick=quit;
  document.getElementById("go").onclick=()=>{ sfx.tap(); nextQ(); };
  window.scrollTo(0,0);
}

function nextQ(){
  if (!L.queue.length) return L.mode==="review"?finishReview():finishPhase();
  const q=L.cur=L.queue.shift();
  app.innerHTML = `<div class="screen">${topBar()}<div class="q"><div class="qhead">
      <div class="type">${L.mode==="review"?"Revisão · ":""}${esc(q.kind||{choice:"Escolha",build:"Monte a frase",match:"Associe"}[q.type])}</div><div class="qm">${mascotSVG(M(),"thinking")}</div></div>
      ${q.situation?`<div class="sit"><span>📍</span><span>${esc(q.situation)}</span></div>`:""}
      ${q.dialog?dialogHTML(q.dialog):""}
      <h3>${esc(q.prompt)}</h3><div id="body"></div></div>
    <div class="foot" id="foot"><div class="fb" id="fb"></div><button class="btn" id="check" disabled>Verificar</button></div></div>`;
  document.getElementById("quit").onclick=quit;
  ({choice:qChoice, build:qBuild, match:qMatch})[q.type](q);
  window.scrollTo(0,0);
}
function qChoice(q){
  const body=document.getElementById("body"), btn=document.getElementById("check");
  body.innerHTML=(q.sentence?`<div class="sent"><button class="spk" data-say="${esc(q.sentence.replace("___","…"))}">🔊</button><span>${esc(q.sentence)}</span></div>`:"")
    +`<div class="opts">${shuffle(q.options.map((o,i)=>i)).map(i=>`<button class="opt" data-i="${i}">${esc(q.options[i])}</button>`).join("")}</div>`;
  let sel=null; const opts=[...body.querySelectorAll(".opt")];
  opts.forEach(b=>b.onclick=()=>{ opts.forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel=+b.dataset.i; btn.disabled=false; sfx.tap(); });
  btn.onclick=()=>{ const ok=sel===q.answer; opts.forEach(x=>{ x.disabled=true; if(+x.dataset.i===q.answer) x.classList.add("good"); if(!ok&&+x.dataset.i===sel) x.classList.add("bad"); }); result(ok,q.options[q.answer]); };
}
function qBuild(q){
  const body=document.getElementById("body"), btn=document.getElementById("check");
  body.innerHTML=`<div class="slot" id="slot"></div><div class="bank">${shuffle(q.words).map(w=>`<button class="w">${esc(w)}</button>`).join("")}</div>`;
  const slot=body.querySelector("#slot"), picked=[];
  body.querySelectorAll(".bank .w").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("used")||btn.dataset.locked) return; b.classList.add("used"); sfx.tap();
    const c=document.createElement("button"); c.className="w"; c.textContent=b.textContent; slot.appendChild(c); picked.push({c,b});
    c.onclick=()=>{ if(btn.dataset.locked) return; c.remove(); b.classList.remove("used"); picked.splice(picked.findIndex(p=>p.c===c),1); btn.disabled=!picked.length; };
    btn.disabled=false; });
  btn.onclick=()=>{ btn.dataset.locked=1; result(norm(picked.map(p=>p.b.textContent).join(" "))===norm(q.answer), q.answer); };
}
function qMatch(q){
  const body=document.getElementById("body"), btn=document.getElementById("check");
  const left=shuffle(q.pairs.map((p,i)=>({t:p[0],i}))), right=shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
  body.innerHTML=`<div class="pairs">${left.map((l,r)=>`<button class="opt" data-side="L" data-i="${l.i}">${esc(l.t)}</button><button class="opt" data-side="R" data-i="${right[r].i}">${esc(right[r].t)}</button>`).join("")}</div>`;
  btn.style.display="none"; let pick=null, matched=0, errs=0;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("done")) return;
    if(b.dataset.side==="L") speak(b.textContent);
    if(!pick||pick.dataset.side===b.dataset.side){ if(pick) pick.classList.remove("sel"); pick=b; b.classList.add("sel"); sfx.tap(); return; }
    if(pick.dataset.i===b.dataset.i){ [pick,b].forEach(x=>{x.classList.remove("sel"); x.classList.add("done"); x.disabled=true;}); sfx.ok(); matched++;
      if(matched===q.pairs.length){ btn.style.display=""; result(errs===0,null); } }
    else { errs++; sfx.no(); const a=pick; [a,b].forEach(x=>{x.classList.remove("sel"); x.classList.add("bad","shake");}); setTimeout(()=>[a,b].forEach(x=>x.classList.remove("bad","shake")),450); }
    pick=null; });
}

/* cada exercício é respondido uma vez; erro vai para a Revisão (sem repetir na hora) */
function result(ok, correctText){
  const foot=document.getElementById("foot"), fb=document.getElementById("fb"), btn=document.getElementById("check"), q=L.cur;
  L.n++; S.stats.answered++;
  if (ok){
    S.stats.correct++; L.ok++;
    let gain=10;
    if (L.mode==="review"){ gain=8; S.stats.cleared++; L.cleared++; }
    delete S.review[q.qid];
    L.xp+=gain; L.row=(L.row||0)+1; foot.className="foot ok"; sfx.ok();
    const wow=L.row===3, l=mascotLine(M(),"happy");
    fb.innerHTML=`${mbox(wow?"surprised":"happy")}<div><span class="h">${wow?"3 in a row! ":""}${esc(l[0])} +${gain} XP</span><span class="pt">${esc(l[1])}</span><p>${q.explain}</p></div>`;
  } else {
    L.mistakes++; L.row=0; S.review[q.qid]={n:((S.review[q.qid]||{}).n||0)+1, d:dayStr()};
    foot.className="foot no"; sfx.no();
    const l=mascotLine(M(),"sad");
    fb.innerHTML=`${mbox("sad")}<div><span class="h">${esc(l[0])}</span><span class="pt">${esc(l[1])}</span>${correctText?`<p>Resposta certa: <b>${esc(correctText)}</b></p>`:""}<p>${q.explain}</p><p style="font-size:13px;color:var(--muted)">Ela entra na sua Revisão.</p></div>`;
  }
  persist();
  document.querySelector(".bar i").style.width=(L.n/L.total*100)+"%";
  const pep = S.stats.answered % PEP_EVERY === 0;
  btn.disabled=false; btn.textContent="Continuar";
  btn.onclick=()=>{ sfx.tap(); pep ? pepTalk() : nextQ(); };
}

function pepTalk(){
  const l=mascotLine(M(),"encourage");
  app.innerHTML=`<div class="screen pep">${mbox("encourage")}
    <div class="bubble">${esc(l[0])}<small>${esc(l[1])}</small></div>
    <div class="meta">✍️ ${S.stats.answered} exercícios feitos · 🎯 ${accuracy()}% de acertos</div>
    <div class="foot"><button class="btn" id="go">Continuar</button></div></div>`;
  sfx.win(); document.getElementById("go").onclick=()=>{ sfx.tap(); nextQ(); };
}

function addXP(n){ S.xp+=n; const t=dayStr(); S.days[t]=(S.days[t]||0)+n; }

function finishPhase(){
  const {p,b}=L, first=!done(p.id);
  const stars=L.mistakes===0?3:L.mistakes===1?2:1, acc=Math.round(L.ok/L.total*100);
  const lines=[["Respostas certas",L.xp]];
  if (first) lines.push(["Fase concluída",20]);
  if (!L.mistakes) lines.push(["Sem erros",10]);
  if (touchDay()) lines.push([`Sequência de ${S.streak} dia${S.streak>1?"s":""}`,5*Math.min(S.streak,7)]);
  const prev=S.phases[p.id]||{stars:0,best:0,plays:0};
  S.phases[p.id]={stars:Math.max(prev.stars,stars), best:Math.max(prev.best,acc), plays:prev.plays+1};
  const blockNow = first && b.phases.every(x=>done(x.id));
  if (blockNow) lines.push(["Bloco completo!",100]);
  const total=lines.reduce((s,l)=>s+l[1],0); addXP(total);
  S.history.push({d:dayStr(), t:p.title, c:L.ok, n:L.total, xp:total}); S.history=S.history.slice(-40);
  const news=checkAch(); persist();
  const nd=b.phases.filter(x=>done(x.id)).length, nx=nextActivity();
  const mood=blockNow?"celebrate":"excited", l=mascotLine(M(),mood);
  app.innerHTML=`<div class="screen"><div class="end">
      ${mbox(mood)}
      <h2>${blockNow?"Bloco completo!":"Fase concluída!"}</h2><div class="sub">${esc(p.title)} · ${esc(p.pt)}</div>
      <div class="bubble">${esc(l[0])}<small>${esc(l[1])}</small></div>
      <div class="st">${starsTxt(stars)}</div>
      <div class="cards3"><div class="card"><b>⚡ ${total}</b><span>XP</span></div><div class="card"><b>🎯 ${acc}%</b><span>Acertos</span></div><div class="card"><b>🔥 ${S.streak}</b><span>Dias</span></div></div>
      <div class="done-goal"><small>✔ Objetivo cumprido</small>${esc(p.goal)}</div>
      <div class="xpl">${lines.map(x=>`<div><span>${esc(x[0])}</span><b>+${x[1]} XP</b></div>`).join("")}</div>
      <div class="bprog"><div class="t">${b.emoji} ${esc(b.title)} · ${nd} de ${b.phases.length} fases</div>
        <div class="steps">${b.phases.map(x=>`<i class="${done(x.id)?"on":""}"></i>`).join("")}</div>
        <div class="n">${nd===b.phases.length?"Agora você consegue cumprimentar, se apresentar e manter uma conversa curta em inglês.":`Falta${b.phases.length-nd>1?"m":""} ${b.phases.length-nd} fase${b.phases.length-nd>1?"s":""} para completar o bloco.`}</div></div>
      ${news.map(a=>`<div class="newach"><b>${a.e} Conquista: ${esc(a.t)}</b>${esc(a.d)}</div>`).join("")}
      ${L.mistakes?`<p class="empty" style="margin-top:12px">O que você errou foi para a <b>Revisão</b>.${stars<3?" Refaça a fase sem erros para ganhar 3 estrelas.":""}</p>`:""}
    </div><div class="foot">
      ${nx.type!=="all"?`<button class="btn" id="nx" style="margin-bottom:10px">${nx.type==="phase"?`Próxima: ${esc(nx.p.title)}`:"Próxima: Revisão"}</button>`:""}
      <button class="btn ghost" id="map">Ver mapa</button></div></div>`;
  sfx.win(); confetti(blockNow?130:60);
  const nb=document.getElementById("nx"); if(nb) nb.onclick=()=>nx.type==="review"?startReview():startPhase(nx.p.id);
  document.getElementById("map").onclick=quit; window.scrollTo(0,0);
}
function finishReview(){
  const bonus=touchDay()?5*Math.min(S.streak,7):0, total=L.xp+bonus; addXP(total);
  S.history.push({d:dayStr(), t:"Revisão", c:L.ok, n:L.total, xp:total}); S.history=S.history.slice(-40);
  const news=checkAch(); persist();
  const left=Object.keys(S.review).length, l=mascotLine(M(),"excited");
  app.innerHTML=`<div class="screen"><div class="end">${mbox("excited")}
      <h2>Revisão feita!</h2><div class="sub">Você reforçou ${L.cleared} de ${L.total} item(ns)</div>
      <div class="bubble">${esc(l[0])}<small>${esc(l[1])}</small></div>
      <div class="cards3" style="margin-top:14px"><div class="card"><b>⚡ ${total}</b><span>XP</span></div><div class="card"><b>🎯 ${Math.round(L.ok/L.total*100)}%</b><span>Acertos</span></div><div class="card"><b>📌 ${left}</b><span>Restam</span></div></div>
      ${bonus?`<div class="xpl"><div><span>Sequência de ${S.streak} dia(s)</span><b>+${bonus} XP</b></div></div>`:""}
      ${news.map(a=>`<div class="newach"><b>${a.e} Conquista: ${esc(a.t)}</b>${esc(a.d)}</div>`).join("")}
    </div><div class="foot"><button class="btn" id="map">Voltar ao mapa</button></div></div>`;
  sfx.win(); confetti(); document.getElementById("map").onclick=quit;
}

render();
</script>
</body>
</html>
