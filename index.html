<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blurty — o jogo dos 90 Desafios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Literata:ital,wght@0,400;0,600;1,400&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC; --paper2:#F3EBDA; --ink:#2B2A28; --muted:#7A7267;
    --line:#E3D8C3; --green:#3A8F5C; --green-l:#DDF0E3; --red:#C8553D; --red-l:#F8E1DA;
    --gold:#E0A526; --blue:#2F6F9F; --blue-l:#DCEAF5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#EADFC9;color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:flex;justify-content:center}
  #app{width:100%;max-width:560px;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;position:relative;
       box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(60,40,10,.12)}
  button{font-family:inherit;cursor:pointer;border:none}
  .screen{flex:1;display:flex;flex-direction:column;animation:turn .35s ease}
  @keyframes turn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

  /* ---------- capa / sumário ---------- */
  .cover{padding:32px 24px 20px;text-align:center;border-bottom:2px dashed var(--line)}
  .cover small{letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-size:12px}
  .cover h1{font-family:Fraunces,serif;font-size:44px;line-height:1.1;margin:10px 0 6px}
  .cover p{margin:0;color:var(--muted);font-family:Literata,serif;font-style:italic}
  .stats{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
  .toc{padding:18px 18px 30px;display:flex;flex-direction:column;gap:12px}
  .toc h2{font-family:Fraunces,serif;font-size:18px;margin:6px 6px 2px;color:var(--muted)}
  .chap{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--line);
        border-bottom-width:5px;border-radius:16px;padding:14px 16px;transition:transform .1s}
  .chap:active{transform:translateY(2px);border-bottom-width:3px}
  .chap .num{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--paper2)}
  .chap .t{flex:1}
  .chap .t b{display:block;font-size:16px}
  .chap .t span{font-size:13px;color:var(--muted)}
  .chap .stars{font-size:15px;letter-spacing:1px;color:var(--gold);white-space:nowrap}
  .chap.locked{opacity:.5;cursor:not-allowed}
  .chap.locked .num{filter:grayscale(1)}

  /* ---------- topo da lição ---------- */
  .top{display:flex;align-items:center;gap:12px;padding:14px 16px;position:sticky;top:0;background:var(--paper);z-index:5}
  .x{background:none;font-size:24px;color:var(--muted);padding:4px 8px}
  .bar{flex:1;height:14px;background:var(--paper2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s ease}
  .combo{font-weight:800;color:var(--gold);min-width:44px;text-align:right;font-size:15px}

  /* ---------- página de leitura ---------- */
  .page{padding:6px 24px 120px;font-family:Literata,serif;font-size:18px;line-height:1.65}
  .page .kicker{font-family:Nunito;font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
  .page h2{font-family:Fraunces,serif;font-size:28px;line-height:1.15;margin:6px 0 16px}
  .page p{margin:0 0 14px}
  .ex{background:#fff;border-left:4px solid var(--blue);border-radius:4px 12px 12px 4px;padding:12px 14px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
  .ex .en{font-weight:600}
  .ex .pt{display:block;font-size:15px;color:var(--muted);font-style:italic}
  .tip{background:var(--gold);background:#FCEFCF;border:2px dashed var(--gold);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:16px}
  .gl{border-bottom:2px dotted var(--blue);cursor:pointer;position:relative}
  .gl.open::after{content:attr(data-t);position:absolute;left:50%;bottom:130%;transform:translateX(-50%);background:var(--ink);color:#fff;
       font-family:Nunito;font-size:13px;font-weight:700;white-space:nowrap;padding:5px 10px;border-radius:8px;z-index:3}
  .hint{font-family:Nunito;font-size:13px;color:var(--muted);margin-top:4px}
  .spk{flex:none;background:var(--blue-l);color:var(--blue);width:34px;height:34px;border-radius:50%;font-size:16px}

  /* ---------- pergunta ---------- */
  .q{padding:8px 22px 150px}
  .q .type{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .q h3{font-family:Fraunces,serif;font-size:24px;line-height:1.25;margin:6px 0 18px}
  .q .sent{font-family:Literata,serif;font-size:19px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px;display:flex;gap:10px;align-items:center}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;text-align:left;font-size:17px;font-weight:700;color:var(--ink);transition:transform .08s}
  .opt:active{transform:translateY(2px)}
  .opt.sel{border-color:var(--blue);background:var(--blue-l)}
  .opt.good{border-color:var(--green);background:var(--green-l)}
  .opt.bad{border-color:var(--red);background:var(--red-l)}
  .opt:disabled{cursor:default}
  /* montar frase */
  .slot{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 12px;margin-bottom:22px;align-content:flex-start}
  .bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .w{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 13px;font-size:17px;font-weight:700;color:var(--ink)}
  .w.used{visibility:hidden}
  /* pares */
  .pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pairs .opt{text-align:center;font-size:16px;padding:14px 8px}
  .pairs .opt.done{opacity:.35;border-color:var(--green);background:var(--green-l)}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* ---------- rodapé ---------- */
  .foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;padding:16px 18px 20px;background:var(--paper);border-top:2px solid var(--line);z-index:10}
  .foot.ok{background:var(--green-l);border-color:var(--green)}
  .foot.no{background:var(--red-l);border-color:var(--red)}
  .fb{margin-bottom:12px;display:none}
  .foot.ok .fb,.foot.no .fb{display:block;animation:turn .25s}
  .fb b{font-size:19px}
  .foot.ok .fb b{color:var(--green)} .foot.no .fb b{color:var(--red)}
  .fb p{margin:4px 0 0;font-size:15px}
  .btn{width:100%;padding:15px;border-radius:14px;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;
       background:var(--green);box-shadow:0 4px 0 #2B6C45}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2B6C45}
  .btn:disabled{background:#CFC6B5;box-shadow:0 4px 0 #B3A993;cursor:default}
  .foot.no .btn{background:var(--red);box-shadow:0 4px 0 #9A3F2C}
  .btn.blue{background:var(--blue);box-shadow:0 4px 0 #1F5075}

  /* ---------- fim ---------- */
  .end{padding:40px 24px 140px;text-align:center}
  .end .big{font-size:64px;line-height:1}
  .end h2{font-family:Fraunces,serif;font-size:30px;margin:14px 0 4px}
  .end .st{font-size:42px;color:var(--gold);letter-spacing:6px;margin:14px 0}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
  .card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 6px}
  .card b{display:block;font-size:22px}
  .card span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .mission{margin-top:26px;text-align:left;background:#fff;border:2px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:14px 16px}
  .mission .kicker{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#A87A12}
  .mission p{font-family:Literata,serif;font-size:16px;margin:8px 0 12px}
  .mbtn{width:100%;padding:11px;border-radius:12px;background:var(--paper2);font-weight:800;font-size:15px;color:var(--ink)}
  .mbtn.on{background:var(--green-l);color:var(--green)}
  .endnote{margin-top:20px;font-family:Literata,serif;font-style:italic;color:var(--muted)}
  .confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   CONTEÚDO DO LIVRO
   Para trocar pelo seu livro, basta editar este objeto.
   Blocos da leitura:  {p:"texto"} | {ex:"English", pt:"tradução"} | {tip:"dica"}
   [[palavra|tradução]] vira palavra tocável com tradução.
   Tipos de pergunta: choice | build | match
   ========================================================= */
const BOOK = {
  title: "Blurty",
  subtitle: "Não pensa, só solta! · o jogo do livro Inglês para Brasileiros – 90 Desafios",
  endNote: "Fim da versão piloto. As Semanas 2 a 13 seguem no livro completo.",
  chapters: [
    /* ===================== PARTE I ===================== */
    {
      id: "pref", part: "Parte I — O Manifesto", label: "Prefácio", emoji: "🧱",
      title: "A parede de vidro", sub: "Por que você entende, mas trava",
      reading: [
        {p: "Você entende inglês: lê um artigo sem dicionário e acompanha séries com legenda em inglês. Mas, quando alguém fala com você, a mente esvazia. Você monta a frase em português, traduz, confere a gramática… e a conversa já mudou de assunto."},
        {p: "O intermediário vive atrás de uma <b>parede de vidro</b>. Ela não é feita de vocabulário nem de gramática. É feita de três coisas:"},
        {tip: "1️⃣ <b>Falta de produção</b>: anos ouvindo e lendo, quase nenhuma hora falando.<br>2️⃣ <b>Tradução mental</b>: lenta demais para uma conversa real.<br>3️⃣ <b>Medo de errar</b>: você percebe os próprios erros e prefere o silêncio."},
        {p: "O paradoxo: quanto mais você sabe, mais trava. O iniciante fala errado e segue em frente; o intermediário fica calado. Essa fase tem nome: <b>o platô do intermediário</b>."},
        {p: "O que destrava a fala é <b>falar</b>: 90 desafios, cerca de 15 minutos por dia, em voz alta, com correção da IA. São cerca de <b>22 horas de prática ativa</b>."}
      ],
      questions: [
        {type:"choice", prompt:"Segundo o livro, a parede de vidro é feita de…", options:["Falta de vocabulário","Gramática fraca","Falta de produção, tradução mental e medo de errar"], answer:2,
         explain:"Você já sabe palavras e gramática suficientes. O que falta é usar."},
        {type:"choice", prompt:"Quem trava mais, segundo o paradoxo do livro?", options:["O iniciante","O intermediário"], answer:1,
         explain:"Quanto mais você sabe, mais percebe os erros, e mais trava."},
        {type:"choice", prompt:"O que destrava a fala?", options:["Mais uma lista de vocabulário","Mais um curso de gramática","Falar todos os dias, em voz alta, com feedback","Mais séries com legenda"], answer:2,
         explain:"Estudar mais do mesmo jeito não muda o platô. Falar muda."},
        {type:"choice", prompt:"Quanto tempo de prática ativa os 90 desafios somam?", options:["Cerca de 5 horas","Cerca de 22 horas","Cerca de 90 horas"], answer:1,
         explain:"90 dias × 15 minutos ≈ 22 horas."},
        {type:"match", prompt:"Ligue cada camada ao que ela significa", pairs:[["Falta de produção","quase nunca falar"],["Tradução mental","pensar em português"],["Medo de errar","preferir o silêncio"]],
         explain:"As três camadas da parede de vidro."},
        {type:"choice", prompt:"Ao fim dos 90 dias, o livro promete que você vai…", options:["Perder o sotaque","Entender todos os filmes sem legenda","Falar de 3 a 5 minutos sobre temas conhecidos sem travar"], answer:2,
         explain:"Sem promessa milagrosa: fala destravada para quem cumprir os desafios."}
      ]
    },
    {
      id: "cap1", part: "Parte I — O Manifesto", label: "Capítulo 1", emoji: "🎯",
      title: "A Promessa Desafiadora", sub: "Fluência antes de perfeição",
      reading: [
        {p: "Você não tem um problema de inglês. Você tem um problema de <b>exposição</b>: quase nenhuma hora falando frases suas."},
        {p: "Falar é uma <b>habilidade motora</b>. A boca precisa de repetição, como as mãos de quem aprende um instrumento. Ninguém aprende violão só assistindo aos outros tocarem."},
        {tip: "🏆 <b>Regra de ouro (Dias 1–30): não pare.</b> Errou o tempo verbal? Continue. Esqueceu a palavra? Contorne.<br>Primeiro você <b>fala</b>; <b>depois</b> a IA mostra os erros."},
        {p: "<b>Os dias críticos:</b> 1–7 estranhamento · 8–15 o teste de verdade (muita gente desiste aqui) · 16–30 primeiro destravamento · 31–60 sustentação · 61–90 domínio."},
        {p: "O compromisso: <b>15 minutos por dia, 90 dias seguidos, nenhum dia zerado.</b>"}
      ],
      questions: [
        {type:"choice", prompt:"Falar inglês é, segundo o livro, uma habilidade…", options:["teórica","motora","de memorização"], answer:1,
         explain:"Como tocar um instrumento: precisa de repetição."},
        {type:"choice", prompt:"Você errou um tempo verbal no meio da fala. Nos primeiros 30 dias, você deve…", options:["Parar e recomeçar a frase","Continuar falando","Pesquisar a regra na hora"], answer:1,
         explain:"Regra de ouro: fluência antes de perfeição."},
        {type:"choice", prompt:"Em qual fase muita gente abandona qualquer método?", options:["Dias 1–7","Dias 8–15","Dias 61–90"], answer:1,
         explain:"A novidade acaba e a evolução parece invisível. Releia este capítulo nesses dias."},
        {type:"build", prompt:"Monte a regra de ouro", words:["fluência","antes","de","perfeição","depois","gramática"],
         answer:"fluência antes de perfeição", explain:"Primeiro falar, depois corrigir."},
        {type:"match", prompt:"Ligue cada fase ao que acontece nela", pairs:[["Dias 1–7","estranhamento"],["Dias 16–30","primeiro destravamento"],["Dias 31–60","sustentação"],["Dias 61–90","domínio"]],
         explain:"O começo é fácil, o meio é neblina, o topo é de quem não para."},
        {type:"choice", prompt:"Em quais dias você grava sua fala para comparar a evolução?", options:["1, 30, 60 e 90","Todo domingo","Só no Dia 90"], answer:0,
         explain:"Progresso registrado: a comparação não mente."}
      ]
    },
    {
      id: "cap2", part: "Parte I — O Manifesto", label: "Capítulo 2", emoji: "📖",
      title: "Como Usar Este Livro", sub: "A regra do nunca zero",
      reading: [
        {p: "Um desafio por dia, todos os dias, na ordem."},
        {tip: "🚫 <b>Regra do nunca zero:</b> pode fazer malfeito, em 5 minutos, cansado, às 23h, em voz baixa. Só não pode zerar o dia."},
        {p: "<b>Perdeu um dia?</b> Regra das 24 horas: faça o desafio perdido junto com o do dia seguinte. Nunca dois dias seguidos sem treino."},
        {p: "Cada dia tem: desafio, tempo, instrução exata, frases-modelo, <b>IA valida</b>, por que funciona, critério de sucesso, modo difícil e diário."},
        {p: "Equipamento: celular com gravador, uma IA com texto e voz, fones e um caderno. Só isso."},
        {p: "Fora dos 15 minutos: celular em inglês, podcasts no trajeto, séries com legenda <b>em inglês</b> e pensar em inglês no banho ou na caminhada."}
      ],
      questions: [
        {type:"choice", prompt:"Qual destas atitudes quebra a regra do nunca zero?", options:["Fazer o desafio em 5 minutos","Fazer cansado, às 23h","Pular o dia"], answer:2,
         explain:"Malfeito vale. Zerado, não."},
        {type:"choice", prompt:"Você perdeu o desafio de ontem. O que fazer?", options:["Recomeçar do Dia 1","Fazer o de ontem junto com o de hoje","Pular e seguir"], answer:1,
         explain:"Regra das 24 horas."},
        {type:"choice", prompt:"O que vale mais, segundo o livro?", options:["3 horas no fim de semana","15 minutos todos os dias"], answer:1,
         explain:"Constância vence intensidade."},
        {type:"choice", prompt:"Séries devem ser vistas com legenda em…", options:["português","inglês"], answer:1,
         explain:"Legenda em inglês, nunca em português."},
        {type:"choice", prompt:"O mesmo erro aparece 5 dias seguidos no diário. E agora?", options:["Ignore, é normal","Ele vira prioridade"], answer:1,
         explain:"O diário serve para revelar padrões."},
        {type:"match", prompt:"Ligue cada bloco do dia à sua função", pairs:[["Frases-modelo","blocos prontos"],["IA valida","prompt de correção"],["Critério de sucesso","cumpriu ou falhou"],["Modo difícil","versão mais pesada"]],
         explain:"Todos os 90 desafios seguem esse formato."}
      ]
    },
    {
      id: "cap3", part: "Parte I — O Manifesto", label: "Capítulo 3", emoji: "🤖",
      title: "IA Como Treinador Pessoal", sub: "Sua arma secreta",
      reading: [
        {p: "A IA é o treinador disponível às 23h, que não cansa e não julga: um <b>espelho com opinião</b>."},
        {tip: "<b>Regra 1:</b> a IA corrige, você produz. Nunca peça para ela escrever o que você vai falar.<br><b>Regra 2:</b> exija feedback honesto. “Great job!” não ajuda ninguém.<br><b>Regra 3:</b> transforme correção em repetição."},
        {p: "Depois de cada correção: leia a versão corrigida em voz alta <b>3 vezes</b>, feche o texto e diga tudo de novo, e anote os 3 erros principais."},
        {ex: "Be direct. Only praise what is genuinely good.", pt: "Seja direto. Só elogie o que for realmente bom."},
        {ex: "Is my original sentence actually wrong, or just less common?", pt: "Minha frase original está errada ou só é menos comum?"},
        {p: "Cuidado: a IA também erra. Na dúvida, confira em um dicionário confiável (Cambridge, Oxford, Longman)."}
      ],
      questions: [
        {type:"choice", prompt:"Qual é a ordem certa?", options:["A IA escreve, você lê em voz alta","Você fala primeiro, depois a IA corrige"], answer:1,
         explain:"Se a IA pensa por você, você só copia."},
        {type:"choice", prompt:"Por que o prompt pede para a IA ser direta?", options:["Porque IAs tendem a ser gentis demais","Para economizar tempo","Porque é mais educado"], answer:0,
         explain:"Elogio vazio não corrige nada."},
        {type:"choice", prompt:"Depois da correção, você lê a versão corrigida em voz alta…", options:["1 vez","3 vezes","10 vezes"], answer:1,
         explain:"Regra 3: correção vira repetição."},
        {type:"choice", prompt:"A IA “corrigiu” algo que parecia certo. O que fazer?", options:["Aceitar sempre","Perguntar se está errado ou só é menos comum, e conferir no dicionário"], answer:1,
         explain:"Use a IA como treinador, não como autoridade final."},
        {type:"build", prompt:"Monte em inglês: “Explique de novo em inglês mais simples.”", words:["Explain","it","again","in","simpler","English","Portuguese","more"],
         answer:"Explain it again in simpler English", explain:"Pedir explicação em inglês também é treino."},
        {type:"choice", prompt:"No modo de voz, a IA deve responder com…", options:["Textos longos e detalhados","2–3 frases e sempre uma pergunta de volta"], answer:1,
         explain:"Assim você fala mais do que ela."}
      ]
    },
    {
      id: "cap4", part: "Parte I — O Manifesto", label: "Capítulo 4", emoji: "🗣️",
      title: "Pronúncia: os 10 pontos", sub: "O que denuncia o brasileiro",
      reading: [
        {p: "O objetivo não é soar americano nem britânico. É <b>ser entendido na primeira vez</b>."},
        {tip: "<b>TH</b>: língua entre os dentes (think, this)<br><b>R</b>: a língua não encosta em nada<br><b>T/D antes de i</b>: city, não “citchy”<br><b>Vogal fantasma</b>: big, não “bigui”<br><b>S + consoante</b>: school, não “escool”"},
        {tip: "<b>Vogais curtas × longas</b>: ship × sheep<br><b>Schwa</b>: about = ə-BOUT<br><b>L final</b>: a língua encosta (people)<br><b>-ed</b>: worked /t/ · played /d/ · wanted /ɪd/<br><b>Acento</b>: CA-na-da"},
        {ex: "I think these three things are worth it.", pt: "Eu acho que essas três coisas valem a pena."},
        {ex: "She asked me if I wanted to stay, so I stayed.", pt: "Ela me perguntou se eu queria ficar, então eu fiquei."},
        {p: "<b>Teste do ditado:</b> dite a frase com o teclado do celular em inglês. Se ele escrever certo, você foi entendido."}
      ],
      questions: [
        {type:"choice", prompt:"Como soa o -ed de “worked”?", sentence:"worked", options:["/t/: uórkt","/d/: uórkd","/ɪd/: uórquêd"], answer:0,
         explain:"Depois de som surdo (k) → /t/."},
        {type:"choice", prompt:"Em qual destes verbos o -ed vira uma sílaba extra?", options:["played","asked","wanted"], answer:2,

function today(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const t = today(); if (save.last === t) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  save.streak = (save.last === y) ? save.streak + 1 : 1; save.last = t;
}

/* ================== utilidades ================== */
const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gloss = s => s.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (_,w,t)=>`<span class="gl" data-t="${esc(t)}">${w}</span>`);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => s.toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();

let actx;
function tone(freqs){ try{
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f;
    const t=actx.currentTime+i*.09; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.25); });
}catch(e){} }
const sfx = {ok:()=>tone([660,880]), no:()=>tone([300,220]), tap:()=>tone([520]), win:()=>tone([523,659,784,1046])};

function speak(text){ try{
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=.9; speechSynthesis.speak(u);
}catch(e){} }

document.addEventListener("click", e=>{
  const g = e.target.closest(".gl");
  document.querySelectorAll(".gl.open").forEach(x=>{ if(x!==g) x.classList.remove("open"); });
  if (g){ g.classList.toggle("open"); }
  const s = e.target.closest("[data-say]"); if (s) speak(s.dataset.say);
});

function confetti(){
  const colors=["#3A8F5C","#E0A526","#2F6F9F","#C8553D","#9B6BC4"];
  for(let i=0;i<70;i++){ const d=document.createElement("div"); d.className="confetti";
    d.style.left=Math.random()*100+"vw"; d.style.background=colors[i%colors.length];
    d.style.animationDuration=(1.6+Math.random()*1.6)+"s"; d.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(),3800); }
}

      <div class="stats">
        <span class="pill">🔥 ${save.streak} dia${save.streak===1?"":"s"}</span>
        <span class="pill">⚡ ${save.xp} XP</span>
        <span class="pill">⭐ ${stars}/${BOOK.chapters.length*3}</span>
      </div>
    </div>
    <div class="toc">
      ${BOOK.chapters.map((c,i)=>{
        const unlocked = i===0 || (save.stars[BOOK.chapters[i-1].id]||0)>0;
        const s = save.stars[c.id]||0;
        const head = (i===0 || BOOK.chapters[i-1].part!==c.part) ? `<h2>${c.part}</h2>` : "";
        return head + `<button class="chap ${unlocked?"":"locked"}" data-i="${i}" ${unlocked?"":"aria-disabled='true'"}>
          <div class="num">${unlocked?c.emoji:"🔒"}</div>
          <div class="t"><b>${c.label} · ${c.title}</b><span>${c.sub}${c.mission&&save.missions[c.id]?" · ✅ missão feita":""}</span></div>
          <div class="stars">${s?"★".repeat(s)+"☆".repeat(3-s):""}</div>
        </button>`;}).join("")}
    </div>
  </div>`;
  app.querySelectorAll(".chap").forEach(b=>b.onclick=()=>{
    if (b.classList.contains("locked")){ b.classList.add("shake"); sfx.no(); setTimeout(()=>b.classList.remove("shake"),400); return; }
    sfx.tap(); startChapter(+b.dataset.i);
  });
}

/* ================== lição ================== */
let L; // estado da lição
function startChapter(i){
  const ch = BOOK.chapters[i];
  L = {i, ch, queue: ch.questions.map((q,k)=>({...q,k})), total: ch.questions.length, done:0, mistakes:0, combo:0, best:0, xp:0, seenWrong:new Set()};
  reading();
}

function topBar(pct){
  return `<div class="top"><button class="x" id="quit" aria-label="Sair">✕</button>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="combo">${L.combo>=2?"🔥"+L.combo:""}</div></div>`;
}

function reading(){
  const ch = L.ch;
  app.innerHTML = `<div class="screen">${topBar(0)}
    <div class="page">
      <div class="kicker">${ch.label}</div>
      <h2>${ch.title}</h2>
      ${ch.reading.map(b=>{
        if (b.p)   return `<p>${gloss(b.p)}</p>`;
        if (b.tip) return `<div class="tip">${gloss(b.tip)}</div>`;
        if (b.ex)  return `<div class="ex"><button class="spk" data-say="${esc(b.ex)}" aria-label="Ouvir">🔊</button>
                     <div><span class="en">${esc(b.ex)}</span>${b.pt?`<span class="pt">${esc(b.pt)}</span>`:""}</div></div>`;
      }).join("")}
      <div class="hint">Toque nas palavras sublinhadas para ver a tradução · 🔊 para ouvir</div>
    </div>
    <div class="foot"><button class="btn blue" id="go">Começar desafios</button></div>
  </div>`;
  document.getElementById("quit").onclick = home;
  document.getElementById("go").onclick = ()=>{ sfx.tap(); nextQ(); };
  window.scrollTo(0,0);
}

function nextQ(){
  if (!L.queue.length) return finish();
  L.cur = L.queue.shift();
  const q = L.cur, pct = L.done/L.total*100;
  const labels = {choice:"Escolha a resposta", build:"Monte a frase", match:"Ligue os pares"};
  app.innerHTML = `<div class="screen">${topBar(pct)}
    <div class="q">
      <div class="type">${L.seenWrong.has(q.k)?"🔁 Revisão · ":""}${labels[q.type]}</div>
      <h3>${esc(q.prompt)}</h3>
      <div id="body"></div>
    </div>
    <div class="foot" id="foot">
      <div class="fb" id="fb"></div>
      <button class="btn" id="check" disabled>Verificar</button>
    </div>
  </div>`;
  document.getElementById("quit").onclick = home;
  ({choice:qChoice, build:qBuild, match:qMatch})[q.type](q);
  window.scrollTo(0,0);
}

/* --- múltipla escolha --- */
function qChoice(q){
  const body = document.getElementById("body"), btn = document.getElementById("check");
  body.innerHTML = (q.sentence?`<div class="sent"><button class="spk" data-say="${esc(q.sentence.replace("___","blank"))}">🔊</button><span>${esc(q.sentence)}</span></div>`:"")
    + `<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  let sel = null;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    body.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); sel = +b.dataset.i; btn.disabled=false; sfx.tap();
  });
  btn.onclick = ()=>{
    const ok = sel===q.answer, opts = body.querySelectorAll(".opt");
    opts.forEach(x=>x.disabled=true);
    opts[q.answer].classList.add("good"); if(!ok) opts[sel].classList.add("bad");
    result(ok, q.options[q.answer]);
  };
}

/* --- montar frase --- */
function qBuild(q){
  const body = document.getElementById("body"), btn = document.getElementById("check");
  const words = shuffle(q.words);
  body.innerHTML = `<div class="slot" id="slot"></div><div class="bank" id="bank">${words.map((w,i)=>`<button class="w" data-i="${i}">${esc(w)}</button>`).join("")}</div>`;
  const slot = body.querySelector("#slot"), picked = [];
  body.querySelectorAll("#bank .w").forEach(b=>b.onclick=()=>{
    if (b.classList.contains("used")) return;
    b.classList.add("used"); sfx.tap();
    const c = document.createElement("button"); c.className="w"; c.textContent=b.textContent; slot.appendChild(c);
    picked.push({chip:c, src:b});
    c.onclick = ()=>{ if(btn.dataset.locked) return; c.remove(); b.classList.remove("used"); picked.splice(picked.findIndex(p=>p.chip===c),1); btn.disabled=!picked.length; };
    btn.disabled=false;
  });
  btn.onclick = ()=>{
    btn.dataset.locked=1;
    const ok = norm(picked.map(p=>p.src.textContent).join(" "))===norm(q.answer);
    result(ok, q.answer, true);
  };
}

/* --- ligar pares --- */
function qMatch(q){
  const body = document.getElementById("body"), btn = document.getElementById("check");
  const left = shuffle(q.pairs.map((p,i)=>({t:p[0],i}))), right = shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
  body.innerHTML = `<div class="pairs">${left.map((l,r)=>`
      <button class="opt" data-side="L" data-i="${l.i}">${esc(l.t)}</button>
      <button class="opt" data-side="R" data-i="${right[r].i}">${esc(right[r].t)}</button>`).join("")}</div>`;
  btn.style.display="none";
  let pick = null, matched = 0, errs = 0;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if (b.classList.contains("done")) return;
    if (b.dataset.side==="L") speak(b.textContent);
    if (!pick || pick.dataset.side===b.dataset.side){
      if (pick) pick.classList.remove("sel");
      pick = b; b.classList.add("sel"); sfx.tap(); return;
    }
    if (pick.dataset.i===b.dataset.i){
      [pick,b].forEach(x=>{x.classList.remove("sel"); x.classList.add("done"); x.disabled=true;});
      sfx.ok(); matched++;
      if (matched===q.pairs.length){ btn.style.display=""; result(errs===0, null); }
    } else {
      errs++; sfx.no(); const a=pick;
      [a,b].forEach(x=>{x.classList.remove("sel"); x.classList.add("bad","shake");});
      setTimeout(()=>[a,b].forEach(x=>x.classList.remove("bad","shake")),450);
    }
    pick = null;
  });
}

/* --- resultado de cada pergunta --- */
const PRAISE = ["Mandou bem!","Isso aí!","Perfeito!","Excelente!","Arrasou!"];
function result(ok, correctText, showAnswer){
  const foot = document.getElementById("foot"), fb = document.getElementById("fb"), btn = document.getElementById("check");
  const q = L.cur;
  if (ok){
    L.done++; L.combo++; L.best=Math.max(L.best,L.combo);
    const gain = (L.seenWrong.has(q.k)?5:10) + (L.combo>=3?5:0); L.xp += gain;
    foot.className="foot ok"; sfx.ok();
    fb.innerHTML = `<b>✓ ${PRAISE[Math.random()*PRAISE.length|0]} <span style="font-size:14px">+${gain} XP</span></b><p>${esc(q.explain)}</p>`;
  } else {
    L.mistakes++; L.combo=0; L.seenWrong.add(q.k); L.queue.push(q);
    foot.className="foot no"; sfx.no();
    fb.innerHTML = `<b>✗ Quase!</b>${showAnswer||correctText?`<p>Resposta: <b style="font-size:15px">${esc(correctText)}</b></p>`:""}<p>${esc(q.explain)} Ela volta no final.</p>`;
  }
  document.querySelector(".bar i").style.width = (L.done/L.total*100)+"%";
  document.querySelector(".combo").textContent = L.combo>=2?"🔥"+L.combo:"";
  btn.disabled=false; btn.textContent="Continuar";
  btn.onclick = ()=>{ sfx.tap(); nextQ(); };
}

/* ================== fim do capítulo ================== */
function finish(){
  const stars = L.mistakes===0?3:L.mistakes<=2?2:1;
  const acc = Math.round(L.total/(L.total+L.mistakes)*100);
  save.stars[L.ch.id] = Math.max(save.stars[L.ch.id]||0, stars);
  save.xp += L.xp; bumpStreak(); persist();
  const hasNext = L.i < BOOK.chapters.length-1;
  app.innerHTML = `<div class="screen"><div class="end">
      <div class="big">${stars===3?"🏆":stars===2?"🎉":"💪"}</div>
      <h2>${L.ch.label} concluído!</h2>
      <div style="color:var(--muted);font-family:Literata,serif;font-style:italic">${L.ch.title}</div>
      <div class="st">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <div class="cards">
        <div class="card"><b>⚡ ${L.xp}</b><span>XP</span></div>
        <div class="card"><b>🎯 ${acc}%</b><span>Precisão</span></div>
        <div class="card"><b>🔥 ${L.best}</b><span>Combo</span></div>
      </div>
      ${stars<3?`<p style="margin-top:22px;color:var(--muted)">Refaça sem erros para ganhar 3 estrelas.</p>`:""}
      ${L.ch.mission?`<div class="mission">
          <div class="kicker">🎯 Agora é com você · fora da tela</div>
          <p>${L.ch.mission}</p>
          <button class="mbtn ${save.missions[L.ch.id]?"on":""}" id="mdone">${save.missions[L.ch.id]?"✅ Missão cumprida":"Marcar missão como cumprida"}</button>
        </div>`:""}
      ${!hasNext&&BOOK.endNote?`<p class="endnote">📘 ${BOOK.endNote}</p>`:""}
    </div>
    <div class="foot">
      ${hasNext?`<button class="btn" id="next" style="margin-bottom:10px">Próxima lição</button>`:""}
      <button class="btn blue" id="toc">Voltar ao sumário</button>
    </div></div>`;
  sfx.win(); confetti();
  const md = document.getElementById("mdone");
  if (md) md.onclick = ()=>{
    const on = !save.missions[L.ch.id]; save.missions[L.ch.id] = on; persist();
    md.classList.toggle("on", on); md.textContent = on ? "✅ Missão cumprida" : "Marcar missão como cumprida";
    if (on){ sfx.ok(); confetti(); }
  };
  if (hasNext) document.getElementById("next").onclick=()=>startChapter(L.i+1);
  document.getElementById("toc").onclick=home;
}

home();
</script>
</body>
</html>
